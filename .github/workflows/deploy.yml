name: Deploy to docs.wunderbyte.at

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Deploy to server
        uses: appleboy/scp-action@master
        with:
          host: dedi458.your-server.de
          username: wunder
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 222
          source: "build/*"
          target: "/usr/home/wunder/public_html/docs.wunderbyte.at"
          strip_components: 1
          rm: true
