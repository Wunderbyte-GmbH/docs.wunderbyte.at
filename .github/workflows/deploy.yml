name: Wunderbyte Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wunderbyte-docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ secrets.WUNDERBYTE_SFTP_PASSWORD != '' }}
    runs-on: ubuntu-latest

    env:
      SFTP_HOST: dedi458.your-server.de
      SFTP_PORT: 22
      SFTP_USER: wunder_4
      SFTP_REMOTE_DIR: /
      SFTP_PASSWORD: ${{ secrets.WUNDERBYTE_SFTP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Deploy site over SFTP
        run: npm run deploy:sftp
